<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="cabecalho">
    <h1>📘 Boletim Digital</h1>
    <p class="subtitulo">Pedro Fogaça — 8º Ano A — Nº 27 — 2026</p>
  </header>

  <main class="container">

    <!-- ÁREA DE LOGIN POR PIN -->
    <section id="area-login" class="cartao-login">
      <h2>Acesso ao Boletim</h2>
      <p class="login-info">Turma: <strong>8A</strong> | Chamada: <strong>27</strong></p>
      <div class="grupo-login">
        <input type="password" id="campo-pin" placeholder="Digite seu PIN" maxlength="20" autocomplete="off" />
        <button type="button" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
      </div>
      <p id="mensagem-login" class="mensagem-status"></p>
    </section>

    <!-- ÁREA DO BOLETIM (Exibida após o login) -->
    <div id="conteudo-boletim" style="display: none;">
      
      <div class="acoes-boletim">
        <button type="button" id="btn-alternar-editor" class="btn-acao" onclick="alternarEditor()">Alterar dados</button>
      </div>

      <!-- PAINEL DE EDIÇÃO (Inicialmente oculto) -->
      <section id="painel-editor" class="painel-editor" style="display: none;">
        <h2>Editar Notas e Faltas</h2>
        <div id="container-campos-editor"></div>
        <div class="acoes-editor">
          <button type="button" id="btn-salvar" class="btn-salvar" onclick="salvarBoletim()">Salvar alterações</button>
          <span id="mensagem-salvar" class="mensagem-status"></span>
        </div>
      </section>

      <section class="legenda">
        <h2 class="legenda-titulo">Como a situação é definida</h2>
        <ul class="legenda-lista">
          <li><span class="situacao aprovado">Aprovado</span> média 7,0 ou mais</li>
          <li><span class="situacao recuperacao">Recuperação</span> média de 5,0 a 6,9</li>
          <li><span class="situacao reprovado">Reprovado</span> média abaixo de 5,0</li>
        </ul>
      </section>

      <section id="resumo"></section>

      <section id="lista-materias" class="lista-materias"></section>

    </div>

  </main>

  <footer class="rodape">
    <p>Boletim Digital &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
